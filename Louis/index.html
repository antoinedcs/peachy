<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peachy 🍑</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- VERGER DE PÊCHERS — FOND SVG -->
  <div id="orchard-bg" aria-hidden="true">
    <svg id="orchard-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Ciel au coucher du soleil -->
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#2B0E1A"/>
          <stop offset="35%"  stop-color="#7A2535"/>
          <stop offset="65%"  stop-color="#D45A2A"/>
          <stop offset="100%" stop-color="#F08040"/>
        </linearGradient>
        <!-- Sol -->
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5C3410"/>
          <stop offset="100%" stop-color="#3A1E08"/>
        </linearGradient>
        <!-- Herbe -->
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#7A5520"/>
          <stop offset="100%" stop-color="#5C3410"/>
        </linearGradient>
        <!-- Tronc -->
        <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#3A1E08"/>
          <stop offset="50%"  stop-color="#7A4A1A"/>
          <stop offset="100%" stop-color="#3A1E08"/>
        </linearGradient>
        <!-- Feuillage pêcher -->
        <radialGradient id="foliage1" cx="50%" cy="45%" r="55%">
          <stop offset="0%"   stop-color="#8B4513" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#C5521A" stop-opacity="0.9"/>
        </radialGradient>
        <radialGradient id="foliage2" cx="50%" cy="45%" r="55%">
          <stop offset="0%"   stop-color="#9B3510" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#B84015" stop-opacity="0.9"/>
        </radialGradient>
        <radialGradient id="foliage3" cx="50%" cy="45%" r="55%">
          <stop offset="0%"   stop-color="#883020" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#D06020" stop-opacity="0.85"/>
        </radialGradient>
        <!-- Soleil couchant -->
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#FFE080"/>
          <stop offset="60%"  stop-color="#FF9030"/>
          <stop offset="100%" stop-color="#FF5010" stop-opacity="0"/>
        </radialGradient>
        <!-- Pêche fruit -->
        <radialGradient id="peachfruit" cx="38%" cy="35%" r="60%">
          <stop offset="0%"   stop-color="#FFCC80"/>
          <stop offset="50%"  stop-color="#FF8040"/>
          <stop offset="100%" stop-color="#CC4010"/>
        </radialGradient>
        <!-- Ombre arbres -->
        <filter id="treeshadow">
          <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#1A0500" flood-opacity="0.5"/>
        </filter>
        <!-- Lueur atmosphérique -->
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- CIEL -->
      <rect width="1440" height="900" fill="url(#sky)"/>

      <!-- RAYONS DE LUMIÈRE DU COUCHER -->
      <g opacity="0.12">
        <line x1="720" y1="320" x2="0"    y2="700" stroke="#FFD060" stroke-width="80"/>
        <line x1="720" y1="320" x2="400"  y2="900" stroke="#FFD060" stroke-width="50"/>
        <line x1="720" y1="320" x2="1440" y2="650" stroke="#FFD060" stroke-width="60"/>
        <line x1="720" y1="320" x2="1100" y2="900" stroke="#FFD060" stroke-width="40"/>

      <!-- SOLEIL COUCHANT -->

      <ellipse cx="720" cy="580" rx="80"  ry="80"  fill="#FFE080"   opacity="0.5"/>

      <!-- BRUME HORIZON -->

      <ellipse cx="720" cy="640" rx="1100" ry="80" fill="#FFB060" opacity="0.10"/>

      <!-- COLLINES ARRIÈRE-PLAN -->

      <path d="M0,720 Q180,660 360,690 Q540,720 720,670 Q900,620 1080,680 Q1260,740 1440,700 L1440,900 L0,900 Z"

        <ellipse class="petal p4" cx="1100" cy="220" rx="5.5" ry="2.8" fill="#FFB0C4" transform="rotate(25,1100,220)"/>
        <ellipse class="petal p5" cx="150"  cy="300" rx="5" ry="2.5" fill="#FFD0DC" transform="rotate(-45,150,300)"/>
        <ellipse class="petal p6" cx="680"  cy="120" rx="6" ry="3" fill="#FFB8C8" transform="rotate(10,680,120)"/>
        <ellipse class="petal p7" cx="950"  cy="260" rx="5.5" ry="2.8" fill="#FFC0D0" transform="rotate(-38,950,260)"/>
        <ellipse class="petal p8" cx="1300" cy="190" rx="5" ry="2.5" fill="#FFD0DC" transform="rotate(20,1300,190)"/>
      </g>

      <!-- BRUME BASSE (devant les arbres) -->
      <ellipse cx="720" cy="800" rx="900" ry="80" fill="#FF8040" opacity="0.06"/>
      <rect x="0" y="840" width="1440" height="60" fill="#5C3410" opacity="0.4"/>

      <!-- ÉTOILES (début de nuit) -->
      <g fill="white" opacity="0.6">
        <circle cx="120" cy="60"  r="1.2"/><circle cx="240" cy="40"  r="0.8"/>
        <circle cx="380" cy="80"  r="1.0"/><circle cx="500" cy="30"  r="0.7"/>
        <circle cx="650" cy="55"  r="1.3"/><circle cx="790" cy="25"  r="0.9"/>
        <circle cx="920" cy="70"  r="1.1"/><circle cx="1060" cy="35" r="0.8"/>
        <circle cx="1180" cy="58" r="1.2"/><circle cx="1320" cy="42" r="0.9"/>
        <circle cx="1400" cy="75" r="1.0"/><circle cx="60"   cy="90" r="0.8"/>
      </g>
    </svg>
  </div>

  <!-- Overlay sombre pour lisibilité du contenu -->
  <div id="orchard-overlay"></div>

  <!-- ÉCRAN CONNEXION -->
  <div id="screen-auth" class="screen active">
    <div class="hero-peach" id="hero-peach">
      <div class="hp-eye left"></div>
      <div class="hp-eye right"></div>
      <div class="hp-cheek left"></div>
      <div class="hp-cheek right"></div>
      <div class="hp-mouth"></div>
      <div class="hp-drip"></div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title"><em>Peachy</em></h1>
      <p class="auth-sub">chat en temps réel — style vivant</p>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Connexion</button>
        <button class="auth-tab" onclick="switchTab('register')">S'inscrire</button>
      </div>

      <div id="tab-login">
        <div class="form">
          <div class="field">
            <label>Pseudo</label>
            <input class="input" type="text" id="login-user" placeholder="ton_pseudo" autocomplete="username">
          </div>
          <div class="field">
            <label>Mot de passe</label>
            <input class="input" type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn-main" onclick="doLogin()">Se connecter →</button>
        </div>
      </div>

      <div id="tab-register" style="display:none">
        <div class="form">
          <div class="field">
            <label>Pseudo</label>
            <input class="input" type="text" id="reg-user" placeholder="choisis_un_pseudo" autocomplete="username">
          </div>
          <div class="field">
            <label>Mot de passe</label>
            <input class="input" type="password" id="reg-pass" placeholder="min. 4 caractères" autocomplete="new-password">
          </div>
          <button class="btn-main" onclick="doRegister()">Créer le compte →</button>
        </div>
      </div>

      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>


  <!-- ÉCRAN CHAT -->
  <div id="screen-chat" class="screen">
    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        Peachy
      </div>
      <div class="channel-tabs">
        <button class="ch-tab active" onclick="switchChannel('général')">général</button>
        <button class="ch-tab" onclick="switchChannel('random')">random</button>
        <button class="ch-tab" onclick="switchChannel('aide')">aide</button>
        <button class="ch-tab" onclick="switchChannel('projet')">projet</button>
      </div>
      <div class="topbar-right">
        <div class="online-pill">
          <div class="online-pip"></div>
          <span id="online-count">1 en ligne</span>
        </div>
        <div class="user-avatar" id="user-avatar">?</div>
        <button class="btn-logout" onclick="doLogout()" title="Déconnexion">✕</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="typing-area">
      <div class="mascot" id="mascot">
        <div class="mas-stem"></div>
        <div class="mas-leaf"></div>
        <div class="mas-body"></div>
        <div class="mas-eye left"></div>
        <div class="mas-eye right"></div>
        <div class="mas-cheek left"></div>
        <div class="mas-cheek right"></div>
        <div class="mas-mouth"></div>
      </div>
      <span class="typing-text" id="typing-text"></span>
    </div>

    <div class="input-area">
      <div class="charge-bar">
        <div class="charge-fill" id="charge-fill"></div>
      </div>
      <div class="input-wrap">
        <input type="text" id="msg-input" placeholder="Écris quelque chose…" autocomplete="off" maxlength="500">
        <button class="btn-send" id="btn-send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="peach-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
